<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculer une mention</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="card">
    <h1>Calculer une mention</h1>
    <label for="note">Entrez une note entre 0 et 20</label>
    <input type="number" id="note" step="0.01" placeholder="Ex : 14.5">
    <button id="btn">Afficher la mention</button>
    <p id="resultat" class="resultat"></p>
  </main>
  <script src="index.js"></script>
</body>
</html>
