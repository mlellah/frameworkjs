name: Deploy branches to GitHub Pages

on:
  push:
    branches:
      - tp01
      - calculer_une_mention
      - exercice1_factorielle
      - exercice2_moyenne
      - exercice3_voyelles
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BRANCHES: >-
    tp01
    calculer_une_mention
    exercice1_factorielle
    exercice2_moyenne
    exercice3_voyelles

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (toutes les branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare deployment
        run: |
          mkdir -p _site
          LINKS=""
          for b in $BRANCHES; do
            if git rev-parse --verify "origin/$b" >/dev/null 2>&1; then
              mkdir -p "_site/$b"
              git archive "origin/$b" | tar -x -C "_site/$b"
              rm -rf "_site/$b/.github"
              LINKS="$LINKS<li><a href=\"./$b/\">$b</a></li>"
            else
              echo "Branche $b introuvable, ignorée"
            fi
          done

          echo "<!DOCTYPE html><html lang=\"fr\"><head><meta charset=\"UTF-8\"><title>frameworkjs</title></head><body><h1>frameworkjs</h1><ul>$LINKS</ul></body></html>" > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4